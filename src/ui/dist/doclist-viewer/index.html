<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doclist Viewer - mcp-erp</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #18202b;
        --muted: #607086;
        --line: #dfe5ee;
        --accent: #19705f;
        --chip: #edf4f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      thead th {
        text-align: left;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }

      tbody td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr.clickable {
        cursor: pointer;
      }

      tbody tr.clickable:hover td {
        background: var(--chip);
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 28px;
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .error {
        border: 1px solid #fcd0d0;
        border-radius: 8px;
        padding: 16px;
        background: #fff5f5;
        color: #922;
        font-size: 13px;
      }

      @media (max-width: 720px) {
        main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="empty">No documents</div>
    </main>
    <script>
      // Extract the full structured payload from a message (no unwrap — keeps
      // _title, _rowAction, data array intact on the payload object).
      function extractPayload(message) {
        if (!message || typeof message !== "object") return null;
        if (message.mcpData && typeof message.mcpData === "object") {
          return message.mcpData;
        }
        if (message.structuredContent && typeof message.structuredContent === "object") {
          return message.structuredContent;
        }
        if (
          message.params &&
          typeof message.params.structuredContent === "object"
        ) {
          return message.params.structuredContent;
        }
        if (
          message.params &&
          message.params.result &&
          typeof message.params.result.structuredContent === "object"
        ) {
          return message.params.result.structuredContent;
        }
        var content = message.params && message.params.content;
        if (Array.isArray(content)) {
          var textItem = content.find(function(item) {
            return item && item.type === "text" && typeof item.text === "string";
          });
          if (textItem) {
            try {
              return JSON.parse(textItem.text);
            } catch (_e) {
              return null;
            }
          }
        }
        // Accept a bare array or an object with a data array at root
        if (Array.isArray(message)) return { data: message };
        if (Array.isArray(message.data)) return message;
        return null;
      }

      function escapeHtml(value) {
        if (value === undefined || value === null) return "";
        return String(value).replace(/[&<>"']/g, function(ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      // Derive up to MAX_COLS visible column keys from the first SAMPLE_SIZE rows.
      // Excludes _* meta-keys and columns whose first non-null value is an object/array.
      var MAX_COLS = 6;
      var SAMPLE_SIZE = 3;

      function deriveColumns(rows) {
        var seen = new Set();
        var cols = [];
        var sample = rows.slice(0, SAMPLE_SIZE);
        for (var r = 0; r < sample.length; r++) {
          var row = sample[r];
          if (!row || typeof row !== "object") continue;
          var keys = Object.keys(row);
          for (var k = 0; k < keys.length; k++) {
            var key = keys[k];
            if (seen.has(key)) continue;
            if (key.startsWith("_")) continue;
            var val = row[key];
            if (val !== null && val !== undefined && typeof val === "object") continue;
            seen.add(key);
            cols.push(key);
            if (cols.length >= MAX_COLS) return cols;
          }
        }
        return cols;
      }

      function render(payload) {
        if (payload._error) {
          document.getElementById("app").innerHTML =
            "<div class=\"error\">Unable to load documents. Please try again.</div>";
          return;
        }

        var data = Array.isArray(payload.data)
          ? payload.data
          : (Array.isArray(payload) ? payload : []);

        var title = typeof payload._title === "string" && payload._title
          ? payload._title
          : "Documents";

        var rowAction = (payload._rowAction && typeof payload._rowAction === "object")
          ? payload._rowAction
          : null;

        var canDrillDown = rowAction &&
          typeof rowAction.idField === "string" &&
          window.parent !== window;

        var countHtml = "<span class=\"badge\">" + data.length + "</span>";

        if (data.length === 0) {
          document.getElementById("app").innerHTML =
            "<header>" +
              "<h1>" + escapeHtml(title) + "</h1>" +
              countHtml +
            "</header>" +
            "<div class=\"empty\">No documents</div>";
          return;
        }

        var cols = deriveColumns(data);
        if (cols.length === 0) {
          document.getElementById("app").innerHTML =
            "<header>" +
              "<h1>" + escapeHtml(title) + "</h1>" +
              countHtml +
            "</header>" +
            "<div class=\"empty\">No documents</div>";
          return;
        }

        var thead = "<tr>" + cols.map(function(c) {
          return "<th>" + escapeHtml(c) + "</th>";
        }).join("") + "</tr>";

        var rowsHtml = data.map(function(row) {
          if (!row || typeof row !== "object") return "";
          var cells = cols.map(function(c) {
            var v = row[c];
            return "<td title=\"" + escapeHtml(String(v ?? "")) + "\">" +
              escapeHtml(v === undefined || v === null ? "" : String(v)) +
              "</td>";
          }).join("");

          if (canDrillDown) {
            var id = row[rowAction.idField];
            return "<tr class=\"clickable\" data-row-id=\"" +
              escapeHtml(String(id ?? "")) + "\">" + cells + "</tr>";
          }
          return "<tr>" + cells + "</tr>";
        }).join("");

        document.getElementById("app").innerHTML =
          "<header>" +
            "<h1>" + escapeHtml(title) + "</h1>" +
            countHtml +
          "</header>" +
          "<div class=\"panel\">" +
            "<table>" +
              "<thead>" + thead + "</thead>" +
              "<tbody>" + rowsHtml + "</tbody>" +
            "</table>" +
          "</div>";

        if (canDrillDown) {
          document.querySelectorAll("tr.clickable").forEach(function(tr) {
            tr.addEventListener("click", function() {
              var id = tr.getAttribute("data-row-id");
              window.parent.postMessage({
                role: "user",
                content: [{ type: "text", text: id }]
              }, "*");
            });
          });
        }
      }

      function accept(message) {
        var payload = extractPayload(message);
        if (payload) render(payload);
      }

      accept(window.mcpData);

      window.addEventListener("message", function(event) {
        var message = event.data;
        if (message && message.jsonrpc === "2.0" && message.id === "mcp-init") {
          window.parent.postMessage({
            jsonrpc: "2.0",
            method: "ui/notifications/initialized"
          }, "*");
          return;
        }
        if (
          message &&
          message.jsonrpc === "2.0" &&
          message.method === "ui/notifications/tool-input"
        ) {
          return;
        }
        accept(message);
      });

      if (window.parent !== window) {
        window.parent.postMessage({
          jsonrpc: "2.0",
          id: "mcp-init",
          method: "ui/initialize",
          params: {
            clientInfo: { name: "mcp-erp doclist-viewer", version: "1.0.0" },
            capabilities: {}
          }
        }, "*");
      }
    </script>
  </body>
</html>
